<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>NEXUS</title>
  <link rel="icon" href="/ui/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Sora:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/style.css" />
  <link rel="stylesheet" href="/ui/home.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="NEXUS"><img src="/ui/logo.svg" alt="" class="mark" /><span class="word">NEXUS</span></a>
    <div class="top-actions">
      <button id="btn-history" class="tb-btn" aria-label="conversations">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span data-t="history"></span>
      </button>
      <button class="tb-btn" data-new aria-label="new chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="newChat"></span></button>
      <button id="btn-theme" class="tb-icon" aria-label="theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button id="btn-lang" class="tb-icon lang" aria-label="language"></button>
    </div>
  </header>

  <aside id="drawer" class="drawer" aria-label="conversations">
    <div class="drawer-head"><b data-t="history"></b><button class="tb-icon" data-close aria-label="close">×</button></div>
    <button class="new-chat" data-new><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="newChat"></span></button>
    <nav id="history" class="history"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main">
    <section class="home">
      <div class="bento">
        <div class="hero card">
          <p class="hello" id="hello"></p>
          <h1 data-t="ask"></h1>
          <div id="home-slot" class="home-slot"></div>
          <label class="city"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span data-t="city"></span><select id="city"></select></label>
        </div>
        <div class="tile t-weather" id="tile-weather" role="button" tabindex="0"></div>
        <div class="tile t-prayer" id="tile-prayer" role="button" tabindex="0"></div>
        <div class="tile t-fx" id="tile-fx" role="button" tabindex="0"></div>
        <div class="tile t-code" id="tile-code" role="button" tabindex="0"></div>
      </div>
      <div class="popular">
        <h2 data-t="popular"></h2>
        <div id="cats" class="cats"></div>
        <div id="examples" class="examples"></div>
      </div>
    </section>
    <section id="thread" class="thread" aria-live="polite"></section>
  </main>

  <div id="dock" class="dock">
    <form id="composer" class="composer">
      <textarea id="input" rows="1" dir="auto" autocomplete="off"></textarea>
      <button id="send" type="submit" class="send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <p class="hint" data-t="hint"></p>
  </div>

  <script src="/ui/content.js"></script>
  <script src="/ui/history.js"></script>
  <script src="/ui/home.js"></script>
  <script src="/ui/chat.js"></script>
</body>
</html>
