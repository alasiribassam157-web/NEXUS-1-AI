<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>NEXUS-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body class="h-screen flex flex-col">
  <!-- Top bar -->
  <header class="flex items-center justify-between px-4 py-3">
    <button id="btn-new" class="icon-btn" title="محادثة جديدة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="flex items-center gap-2 font-semibold"><span class="orb-sm"></span>NEXUS-1</div>
    <button id="btn-lang" class="icon-btn text-xs font-semibold">EN</button>
  </header>

  <!-- Conversation -->
  <main id="scroll" class="flex-1 overflow-y-auto">
    <div id="empty" class="h-full flex flex-col items-center justify-center px-4 text-center">
      <div class="orb mb-5"></div>
      <h1 id="hello" class="text-2xl sm:text-3xl font-semibold mb-8"></h1>
      <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl"></div>
    </div>
    <div id="thread" class="max-w-3xl mx-auto px-4 py-6 space-y-6 hidden"></div>
  </main>

  <!-- Composer -->
  <footer class="px-4 pb-4 pt-2">
    <form id="form" class="composer max-w-3xl mx-auto">
      <textarea id="input" rows="1" dir="auto" autofocus></textarea>
      <button id="send" type="submit" class="send" aria-label="send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p id="hint" class="text-center text-[11px] text-slate-500 mt-2"></p>
  </footer>

  <script src="/ui/chat.js"></script>
</body>
</html>
