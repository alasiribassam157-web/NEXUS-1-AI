<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <meta name="theme-color" content="#07080b" />
  <title>NEXUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <div class="aura" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <button id="btn-new" class="ghost" title="محادثة جديدة" aria-label="new chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="newChat"></span>
    </button>
    <a class="brand" href="/" aria-label="NEXUS">
      <span class="mark"><i></i></span><span class="word">NEXUS</span>
    </a>
    <button id="btn-lang" class="ghost lang">EN</button>
  </header>

  <main id="scroll">
    <!-- Home -->
    <section id="home" class="home">
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1><span data-t="hello1"></span><br /><em data-t="hello2"></em></h1>

      <div class="composer-slot" id="slot-home"></div>

      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="grid" id="popular"></div>
    </section>

    <!-- Conversation -->
    <section id="thread" class="thread" aria-live="polite"></section>
  </main>

  <div class="dock" id="slot-dock">
    <form id="composer" class="composer">
      <textarea id="input" rows="1" dir="auto" autocomplete="off"></textarea>
      <button id="send" type="submit" class="send" aria-label="send">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="hint" data-t="hint"></p>
  </div>

  <script src="/ui/chat.js"></script>
</body>
</html>
