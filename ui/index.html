<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXUS-1 Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body class="min-h-screen text-slate-200">
  <div class="aurora"></div>

  <!-- Header -->
  <header class="sticky top-0 z-20 glass border-b border-white/5">
    <div class="max-w-[1500px] mx-auto px-4 py-3 flex items-center gap-3">
      <div class="logo-orb"><i data-lucide="brain-circuit" class="w-5 h-5"></i></div>
      <div class="leading-tight">
        <h1 class="font-bold tracking-wide text-lg neon-text">NEXUS-1</h1>
        <p class="text-[11px] text-slate-400" data-i18n="tagline"></p>
      </div>
      <div class="ms-auto flex items-center gap-2">
        <span id="pill-model" class="pill"><span class="dot"></span><span></span></span>
        <span id="pill-safe" class="pill hidden"><i data-lucide="shield" class="w-3 h-3"></i><span data-i18n="safe"></span></span>
        <button id="btn-lang" class="btn-ghost" title="Language"><i data-lucide="languages" class="w-4 h-4"></i><span id="lang-label"></span></button>
      </div>
    </div>
  </header>

  <main class="max-w-[1500px] mx-auto p-4 grid gap-4 lg:grid-cols-12">
    <!-- Command room -->
    <section class="glass card lg:col-span-8 flex flex-col h-[calc(100vh-110px)] min-h-[520px]">
      <div class="card-head">
        <i data-lucide="terminal-square" class="w-4 h-4 text-cyan-300"></i>
        <h2 data-i18n="command_room"></h2>
        <button id="btn-clear" class="btn-ghost ms-auto"><i data-lucide="eraser" class="w-4 h-4"></i></button>
      </div>
      <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      <div class="px-4 pb-2 flex flex-wrap gap-2" id="suggestions"></div>
      <form id="chat-form" class="p-3 border-t border-white/5 flex gap-2">
        <textarea id="chat-input" rows="1" class="input flex-1 resize-none" data-i18n-ph="placeholder"></textarea>
        <button class="btn-primary" type="submit"><i data-lucide="send" class="w-4 h-4"></i></button>
      </form>
    </section>

    <!-- Right column -->
    <aside class="lg:col-span-4 flex flex-col gap-4">
      <section class="glass card">
        <div class="card-head">
          <i data-lucide="activity" class="w-4 h-4 text-violet-300"></i>
          <h2 data-i18n="studio"></h2>
        </div>
        <div class="p-4 space-y-3">
          <button id="btn-train" class="btn-primary w-full justify-center">
            <i data-lucide="zap" class="w-4 h-4"></i><span data-i18n="train"></span>
          </button>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="stat"><p data-i18n="epoch"></p><b id="st-epoch">—</b></div>
            <div class="stat"><p data-i18n="val_acc"></p><b id="st-acc">—</b></div>
            <div class="stat"><p data-i18n="time"></p><b id="st-time">—</b></div>
          </div>
          <div class="h-48"><canvas id="train-chart"></canvas></div>
          <p id="train-msg" class="text-xs text-slate-400 min-h-[1rem]"></p>
        </div>
      </section>

      <section class="glass card flex-1 min-h-[260px] flex flex-col">
        <div class="card-head">
          <i data-lucide="folder-tree" class="w-4 h-4 text-cyan-300"></i>
          <h2 data-i18n="files"></h2>
          <button id="btn-refresh" class="btn-ghost ms-auto"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
        </div>
        <ul id="file-list" class="flex-1 overflow-y-auto p-2 text-sm max-h-72"></ul>
      </section>
    </aside>
  </main>

  <!-- File preview -->
  <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/70 p-4">
    <div class="glass card w-full max-w-3xl max-h-[80vh] flex flex-col">
      <div class="card-head"><i data-lucide="file-code" class="w-4 h-4 text-cyan-300"></i>
        <h2 id="modal-title" class="font-mono text-sm"></h2>
        <button id="modal-close" class="btn-ghost ms-auto"><i data-lucide="x" class="w-4 h-4"></i></button></div>
      <pre id="modal-body" class="code flex-1 overflow-auto m-3"></pre>
    </div>
  </div>

  <!-- Token gate -->
  <div id="gate" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#07090E]/95 p-4">
    <form id="gate-form" class="glass card w-full max-w-sm p-6 space-y-4 text-center">
      <div class="logo-orb mx-auto"><i data-lucide="lock-keyhole" class="w-5 h-5"></i></div>
      <h2 class="font-semibold" data-i18n="gate_title"></h2>
      <input id="gate-input" type="password" class="input w-full" data-i18n-ph="gate_ph" />
      <button class="btn-primary w-full justify-center" data-i18n="gate_btn"></button>
    </form>
  </div>

  <script src="/ui/i18n.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
