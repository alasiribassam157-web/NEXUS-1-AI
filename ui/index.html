<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>NEXUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <aside class="sidebar" aria-label="conversations">
    <div class="side-top">
      <a class="logo" href="/"><span class="logo-mark">N</span><span>NEXUS</span></a>
    </div>
    <button class="new-chat" data-new>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="newChat"></span>
    </button>
    <nav id="history" class="history"></nav>
    <div class="side-foot">
      <button id="btn-theme" class="side-btn">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="theme-label"></span>
      </button>
      <button id="btn-lang" class="side-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="lang-label"></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main-col">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="top-title">NEXUS</span>
      <button class="icon-btn" data-new aria-label="new chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </header>

    <main id="main">
      <section class="home">
        <div class="home-mark">N</div>
        <h1 data-t="hello"></h1>
        <p class="home-sub" data-t="sub"></p>
        <div id="home-slot" class="home-slot"></div>
        <div id="cats" class="cats"></div>
        <div id="examples" class="examples"></div>
      </section>
      <section id="thread" class="thread" aria-live="polite"></section>
    </main>

    <div id="dock" class="dock">
      <form id="composer" class="composer">
        <textarea id="input" rows="1" dir="auto" autocomplete="off"></textarea>
        <button id="send" type="submit" class="send" aria-label="send">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint" data-t="hint"></p>
    </div>
  </div>

  <script src="/ui/content.js"></script>
  <script src="/ui/history.js"></script>
  <script src="/ui/chat.js"></script>
</body>
</html>
