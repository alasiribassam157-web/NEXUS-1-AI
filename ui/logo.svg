<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>NEXUS</title>
  <!-- The knot: two loops woven over and under, forming the X at the heart of NEXUS. -->
  <defs>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9BECC"/>
    </linearGradient>
    <clipPath id="lr"><path d="M32 32L0 0V64ZM32 32L64 0V64Z"/></clipPath>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="#12131A"/>
  <rect x="9" y="23" width="46" height="18" rx="9" transform="rotate(-45 32 32)" fill="none" stroke="url(#iri)" stroke-width="4.6"/>
  <rect x="9" y="23" width="46" height="18" rx="9" transform="rotate(45 32 32)" fill="none" stroke="#12131A" stroke-width="9"/>
  <rect x="9" y="23" width="46" height="18" rx="9" transform="rotate(45 32 32)" fill="none" stroke="url(#silver)" stroke-width="4.6"/>
  <g clip-path="url(#lr)">
    <rect x="9" y="23" width="46" height="18" rx="9" transform="rotate(-45 32 32)" fill="none" stroke="#12131A" stroke-width="9"/>
    <rect x="9" y="23" width="46" height="18" rx="9" transform="rotate(-45 32 32)" fill="none" stroke="url(#iri)" stroke-width="4.6"/>
  </g>
</svg>
